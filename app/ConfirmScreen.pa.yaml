Screens:
  ConfirmScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Label4:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =184
            Size: =19
            Text: =If(varResult = "Enrolled", "Congratulations! You have successfully enrolled for your AHA BLS class.", "Thank you for adding yourself to the waitlist. We will email you if a seat opens.")
            Width: =1266
            X: =24
            Y: =130
      - Button5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(184, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =84
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Refresh(Registrations);Navigate(ClassListScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="RETURN TO HOME PAGE"
            Width: =303
            X: =506
            Y: =613
