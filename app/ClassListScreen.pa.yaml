                                    Align: =Align.Right
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =12
                                    Text: ="Spots Left"
                                    Width: =100
                        - galBLS:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              FillPortions: =0
                              Height: =CountRows(colBLS) * (Self.TemplateHeight + Self.TemplatePadding) + Self.TemplatePadding
                              Items: =colBLS
                              OnSelect: '= '
                              ShowScrollbar: =false
                              TemplatePadding: =10
                              TemplateSize: =85
                              Width: =870
                              X: =40
                              Y: =40
                            Children:
                              - Label3:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    OnSelect: =Select(Parent)
                                    Text: |
                                      =Text(ThisItem.ClassDate, "ddd, mmm d")
