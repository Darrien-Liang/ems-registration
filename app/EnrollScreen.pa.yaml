Screens:
  EnrollScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Label2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =26
            Text: ="Course Confirmation"
            Width: =734
            X: =63
            Y: =34
      - Label7:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =90
            Text: |+
              ="[" & varClass.Course.Value & "]: " & Text(varClass.ClassDate, "dddd, mmmm d") & "  •  " & varClass.TimeText & "  •  " & varClass.Location
            Width: =792
            X: =226
            Y: =99
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(75, 46, 131, 1)
            BorderThickness: =12
            DisabledFill: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =RGBA(75, 46, 131, 1)
            Height: =500
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Width: =1254
            X: =50
            Y: =235
      - Label10:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =41
            Text: |-
              ="Selected Training: "
            Width: =234
            X: =63
            Y: =124
      - txtFirstName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =304
            Y: =324
      - Label11:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =43
            Size: =18
            Text: ="Registration Information"
            Underline: =true
            Width: =317
            X: =518
            Y: =254
      - Label12:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="First Name:"
            X: =128
            Y: =324
      - Label13:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="Last Name:"
            X: =128
            Y: =381
      - txtLastName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =304
            Y: =381
      - Label14:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="UW Email Address:"
            Width: =169
            X: =128
            Y: =438
      - txtEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =304
            Y: =438
      - Button3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |+
              =If(
                  IsBlank(Trim(txtFirstName.Text)) || IsBlank(Trim(txtLastName.Text)),
                      Notify("Please enter your first and last name.", NotificationType.Error),
                  !IsMatch(Trim(txtEmail.Text), Match.Email),
                      Notify("Please enter a valid email address.", NotificationType.Error),
                  IsBlank(ddAffiliation.Selected.Value), 
                      Notify("Please select your affiliation.", NotificationType.Error),
                  // valid: send to the flow
                  Set(varResponse,
                      BLSRegister.Run(Trim(txtLastName.Text), 
                          Lower(Trim(txtEmail.Text)),
                          varClass.ID, Trim(txtFirstName.Text), ddAffiliation.Selected.Value)
                      )
                  );
                  If(
                      varResponse.result = "Duplicate",
                          Notify("You're already registered (or waitlisted) for an upcoming class. Please cancel that registration before signing up for another.", NotificationType.Warning),
                      Set(varResult, varResponse.result);
                      Navigate(ConfirmScreen)
                  )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Submit"
            X: =797
            Y: =620
      - Button4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(184, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(ClassListScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Back"
            X: =358
            Y: =620
      - ddAffiliation:
          Control: Classic/Radio@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =102
            HoverColor: =RGBA(0, 18, 107, 1)
            Items: =["UW Student", "UW Faculty/Staff", "Other"]
            Items.Value: =Value
            RadioBorderColor: =RGBA(0, 18, 107, 1)
            RadioSelectionFill: =RGBA(0, 0, 0, 1)
            RadioSize: =25
            Width: =280
            X: =304
            Y: =503
      - Label9:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="UW Affiliation"
            X: =128
            Y: =529
