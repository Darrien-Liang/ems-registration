Screens:
  EnrollScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Label2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =26
            Text: ="AHA BLS Provider Course - Registration"
            Width: =734
            X: =63
            Y: =34
      - Label7:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =92
            Text: =Text(varClass.ClassDate, "dddd, mmmm d") & "  •  " & varClass.TimeText & "  •  " & varClass.Location
            Width: =782
            X: =228
            Y: =98
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(75, 46, 131, 1)
            BorderThickness: =12
            DisabledFill: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 1)
            FocusedBorderColor: =RGBA(75, 46, 131, 1)
            Height: =500
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Width: =1254
            X: =50
            Y: =235
      - Label10:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =41
            Text: |-
              ="Selected Training: "
            Width: =234
            X: =63
            Y: =124
      - txtFirstName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =278
            Y: =324
      - Label11:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =43
            Size: =18
            Text: ="Registration Information"
            Underline: =true
            Width: =317
            X: =518
            Y: =254
      - Label12:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="First Name:"
            X: =128
            Y: =324
      - Label13:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="Last Name:"
            X: =128
            Y: =413
      - txtLastName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =278
            Y: =413
      - Label14:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="Email Address:"
            X: =128
            Y: =502
      - txtEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =278
            Y: =502
      - Label16:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =67
            Size: =10
            Text: |-
              ="Note: All communication and your AHA BLS card (upon completion of the course) will be sent to this email. To ensure you retain access to your AHA BLS card, please use your personal email address, instead of your UW email."
            Width: =636
            X: =634
            Y: =488
      - Button3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=Refresh(Registrations);\r\nWith(\r\n    {\r\n        seatsLeft: varClass.Capacity - CountRows(Filter(Registrations, ClassID = varClass.ID && Status.Value = \"Enrolled\")),\r\n        activeSignups: CountRows(Filter(Registrations,\r\n            Lower(Email) = Lower(Trim(txtEmail.Text)) &&\r\n            Status.Value <> \"Cancelled\" &&\r\n            ClassID in Filter('BLS Classes', ClassDate >= Today()).ID)) // Allows re-registration only after a course has been completed already (re-cert)\r\n    },\r\n    If(\r\n        IsBlank(Trim(txtFirstName.Text)) || IsBlank(Trim(txtLastName.Text)),\r\n            Notify(\"Please enter your first and last name.\", NotificationType.Error),\r\n        !IsMatch(Trim(txtEmail.Text), Match.Email),\r\n            Notify(\"Please enter a valid email address.\", NotificationType.Error),\r\n        activeSignups > 0,\r\n            Notify(\"You're already registered (or waitlisted) for an upcoming class. Please cancel that registration before signing up for another.\", NotificationType.Warning),\r\n        // all good: save the signup\r\n        Patch(\r\n            \r\n            Registrations,\r\n            Defaults(Registrations),\r\n            {\r\n                // Full Name\r\n                Title: Trim(txtFirstName.Text) & \" \" & Trim(txtLastName.Text),\r\n                \r\n                // Full Name, tokenized\r\n                FirstName: Trim(txtFirstName.Text),\r\n                LastName: Trim(txtLastName.Text),\r\n                CancelToken: Text(GUID()),\r\n                Email: Lower(Trim(txtEmail.Text)),\r\n                ClassID: varClass.ID,\r\n                Status: { Value: If(seatsLeft > 0, \"Enrolled\", \"Waitlisted\") }\r\n                \r\n            }\r\n        );\r\n        Set(varResult, If(seatsLeft > 0, \"Enrolled\", \"Waitlisted\"));\r\n        Navigate(ConfirmScreen)\r\n    )\r\n)"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Submit"
            X: =797
            Y: =620
      - Button4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(184, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(ClassListScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Back"
            X: =358
            Y: =620
