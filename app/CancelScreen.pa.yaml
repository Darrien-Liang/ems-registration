Screens:
  CancelScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varCancelled, false);
        If(
            IsBlank(Param("cancel")),
                Set(varLookup, Blank()),
            Set(varLookup, BLSCancel.Run(Param("cancel"), false))
        )
    Children:
      - Label2_2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =26
            Text: ="Course Cancellation"
            Width: =734
            X: =20
            Y: =20
      - Label8:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =65
            Size: =18
            Text: |-
              =If(
                  varCancelled,
                      "Your registration has been cancelled. To sign up for another class, please use the original link.",
                  IsBlank(Param("cancel")),
                      "This link is invalid, or this registration was already cancelled.",
                  IsBlank(varLookup.result),
                      "Looking up your registration…",
                  varLookup.result = "NotFound",
                      "This link is invalid, or this registration was already cancelled.",
                  "Cancel registration for " & varLookup.name & "?" & Char(10) & varLookup.details
              )
            Width: =789
            X: =263
            Y: =188
      - Button6:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(184, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(varCancelResp, BLSCancel.Run(Param("cancel"), true));
              If(
                  varCancelResp.result = "Cancelled",
                      Set(varCancelled, true);
                      Notify("Your registration has been cancelled.", NotificationType.Success),
                  Notify("Something went wrong. Please contact UW EMS.", NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Cancel Reservation"
            Visible: =varLookup.result = "Found" && !varCancelled
            Width: =325
            X: =495
            Y: =357
