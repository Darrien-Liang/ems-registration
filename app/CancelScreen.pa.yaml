Screens:
  CancelScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varCancelled, false);
        Set(varReg, LookUp(Registrations, CancelToken = Param("cancel") && Status.Value <> "Cancelled"))
    Children:
      - Label2_2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =26
            Text: ="AHA BLS Provider Course - Cancellation"
            Width: =734
            X: =20
            Y: =20
      - Label8:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =65
            Size: =18
            Text: |-
              =If(
                  varCancelled,
                      "Your registration has been cancelled.",
                  IsBlank(varReg),
                      "This link is invalid, or this registration was already cancelled.",
                  "Cancel registration for " & varReg.FirstName & " " & varReg.LastName & "?"
              )
            Width: =789
            X: =263
            Y: =188
      - Button6:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(184, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Patch(Registrations, varReg, { Status: { Value: "Cancelled" } });
              Set(varCancelled, true);
              Notify("Your registration has been cancelled.", NotificationType.Success)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Cancel Reservation"
            Visible: =!IsBlank(varReg) && !varCancelled
            Width: =325
            X: =495
            Y: =357
